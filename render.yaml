services:
  - type: web
    name: nohitatu-website-admin
    runtime: node
    plan: free
    # Repo root so Express can serve ../admin, data/, uploads/
    buildCommand: cd server && npm install
    startCommand: cd server && npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      # Render injects PORT; do not hardcode it
      - key: ADMIN_USER
        value: admin
      # sync:false = set in Render Dashboard Environment (never commit plaintext)
      - key: ADMIN_PASSWORD
        sync: false
      - key: SESSION_SECRET
        generateValue: true
      # Allow static admin UI hosts to call this API with cookies
      - key: ADMIN_CORS_ORIGINS
        value: https://nplmedmarketing-collab.github.io,https://nohitatu.com,https://www.nohitatu.com
      # Google reCAPTCHA v2 secret (set in Render Dashboard; never commit)
      - key: RECAPTCHA_SECRET_KEY
        sync: false
